<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#111827"},
    {"id":"color-ink","type":"color","label":"Text","default":"#ffffff"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#60a5fa"},
    {"id":"font-display","type":"string","label":"Display font","default":"Inter"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #111827; /* Tailwind gray-900 (body in frontend/src/index.css) */
        --color-ink: #ffffff;
        --color-accent: #60a5fa; /* blue-400 (header Activity icon) */
        --font-display: Inter;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--color-ground);
        font-family: var(--font-display), Inter, system-ui, sans-serif;
      }
      .scene-host {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-yl69"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21.2"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scenes. Hook 0-4.6 | Dashboard 4.0-16.6 | Outro 16.1-21.2 (0.5 s overlaps = blur swaps) -->
      <div data-hf-id="hf-qcw6"
        id="hook"
        class="scene-host"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="4.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div data-hf-id="hf-1oqs"
        id="dashboard"
        class="scene-host"
        data-composition-id="dashboard"
        data-composition-src="compositions/dashboard.html"
        data-start="4.0"
        data-duration="12.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div data-hf-id="hf-cedq"
        id="outro"
        class="scene-host"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="16.1"
        data-duration="5.1"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>

      <!-- Music bed: happy-beats-business-moves-vol-9 (114.84 BPM), laid-back. Fades in, fades out under the last line. -->
      <audio data-hf-id="hf-s9jh"
        id="bgm"
        data-start="0"
        data-duration="21.2"
        data-track-index="10"
        data-volume="0.6"
        data-fade-in="0.8"
        data-fade-out="1.4"
        src="assets/music/happy-beats-business-moves-vol-9-by-ende-dot-app.mp3"
      ></audio>

      <!-- Hook: soft drops as the two lines land -->
      <audio data-hf-id="hf-m66l" id="sfx-hook-1" data-start="0.28" data-duration="0.11" data-track-index="11" data-volume="0.62" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio data-hf-id="hf-2ts3" id="sfx-hook-2" data-start="1.42" data-duration="0.19" data-track-index="11" data-volume="0.68" src="assets/sfx/interface/drop_002.ogg"></audio>

      <!-- Dashboard reveal on the 4.23 s strong cue -->
      <audio data-hf-id="hf-mu3s" id="sfx-reveal" data-start="4.18" data-duration="0.18" data-track-index="12" data-volume="0.88" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>

      <!-- Simulated clicks: dashboard-local time + 4.0 s -->
      <audio data-hf-id="hf-h2hz" id="sfx-click-prepare" data-start="5.02" data-duration="0.055" data-track-index="13" data-volume="1.25" src="assets/sfx/ui/click2.ogg"></audio>
      <audio data-hf-id="hf-c8xd" id="sfx-click-inference" data-start="9.07" data-duration="0.036" data-track-index="13" data-volume="1.25" src="assets/sfx/ui/click4.ogg"></audio>
      <audio data-hf-id="hf-mrzf" id="sfx-click-upload" data-start="10.02" data-duration="0.032" data-track-index="13" data-volume="1.25" src="assets/sfx/ui/click5.ogg"></audio>
      <audio data-hf-id="hf-czcr" id="sfx-click-run" data-start="10.82" data-duration="0.055" data-track-index="13" data-volume="1.25" src="assets/sfx/ui/click2.ogg"></audio>

      <!-- Detection boxes land on the 12.65 s strong cue -->
      <audio data-hf-id="hf-5amj" id="sfx-result" data-start="12.6" data-duration="1.5" data-track-index="14" data-volume="0.62" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>

      <!-- Outro title lands on the 16.34 s beat -->
      <audio data-hf-id="hf-1210" id="sfx-title" data-start="16.3" data-duration="0.135" data-track-index="15" data-volume="0.8" src="assets/sfx/impact/impactSoft_medium_002.ogg"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
