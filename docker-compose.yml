services:
  app:
    build: .
    ports:
      - "8082:8082"
    volumes:
      - ./code/out:/app/code/out
      - ./code/data:/app/code/data
    environment:
      # Phase 14 / Option A — propagated by PersonalPortfolio/.env.shared
      SENTRY_DSN: ${SENTRY_DSN_DOCKER:-${SENTRY_DSN:-}}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local-dev}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-local-dev}
      # MLOps observability (additive — see observability/README.md).
      # When unset, the FastAPI prediction-log hook no-ops. When set,
      # it points at prediction-log-postgres started by `make mlops-up`.
      MLOPS_PREDICTION_LOG_DSN: ${MLOPS_PREDICTION_LOG_DSN:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      # Lets the Sentry SDK inside the container reach Spotlight on the host
      - "host.docker.internal:host-gateway"
