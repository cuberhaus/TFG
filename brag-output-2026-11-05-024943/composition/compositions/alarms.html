  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#al-title", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0.2);

    const el = document.getElementById("al-num");

      o,
      { v: 0.24 },
      {
        v: 0.1,
        duration: 1.3,
        ease: "power3.out",
        onUpdate: function () {
          el.textContent = o.v.toFixed(2);

      1.09,

    tl.fromTo("#al-num", { color: "#6b7280" }, { color: "#059669", duration: 1.3, ease: "power2.inOut" }, 1.09);

    // The turn: the control's number (bell at 27.29 s). Then nothing else moves.
