    // Count-up helper: a pure function of timeline time (a tween on a plain object, text written on update).

      const el = document.getElementById("pf-v" + n);
      tl.fromTo("#pf-l" + n, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, start - 0.12);

      // obj starts at 0, so a plain `to` is deterministic on every seek.
      tl.to(
        obj,
        {
          v: target,
          duration: dur,
          ease: "power3.out",
          onUpdate: function () {
            el.textContent = obj.v.toFixed(1) + "%";

        start,
